# Forja pricing table — OpenAI.
#
# Prices are USD per one million tokens, copied from the official pricing page
# on the `checked` date. The `cache_write` column is the short-context 30-minute
# write; models without a separate write charge use 0.0. When the official table
# has no cached-input price, `cache_read` is omitted and cache tokens make the
# cost unknown instead of guessing.
# `models` are lowercase prefix matches after replacing `.` and `_` with `-`;
# the longest match wins.
#
# Source: https://platform.openai.com/docs/pricing
# Checked: 2026-11-14

