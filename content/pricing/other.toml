# Forja pricing table — DeepSeek and Google Gemini.
#
# Prices are USD per one million tokens, copied from the official pages on the
# `checked` date. DeepSeek publishes peak and off-peak rates; the peak rate is
# used here because the transcript does not record which window billed it.
# Gemini only offers implicit caching, so `cache_write` is 0.0.
# `models` are lowercase prefix matches after replacing `.` and `_` with `-`.
#
# Sources:
#   https://api-docs.deepseek.com/quick_start/pricing
#   https://ai.google.dev/gemini-api/docs/pricing
# Checked: 2026-11-14

