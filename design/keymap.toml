key = "Ctrl+K"
scope = "global"
family = "anvil"
title_pt = "Abrir a Bigorna"
title_en = "Open the Anvil"
even_in_terminal = true
note_pt = "Funciona mesmo com o foco no terminal."
note_en = "Works even when the terminal has focus."

