# Forja: mapa de atalhos (formato de máquina)
# Fonte de verdade: design/keymap.md. Atalhos padrão do Windows.
schema_version = 1
platform = "windows"

[meta]
name_pt = "Mapa de atalhos da Forja"
name_en = "Forja keymap"
binding_count = 108

[[binding]]
