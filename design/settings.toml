default = "auto"
options = ["auto", "pt_BR", "en"]
label_pt = "Idioma"
label_en = "Language"
help_pt = "Idioma da interface ou automático pelo sistema."
help_en = "Interface language or automatic from the system."
why = "Auto acompanha o idioma do Windows sem exigir escolha."
label_key = "setting-i18n-language-mode-label"
help_key = "setting-i18n-language-mode-help"

[[setting]]
key = "i18n.language.fallback"
module = "i18n"
group = "appearance"
type = "choice"
default = "en"
options = ["en", "pt_BR"]
label_pt = "Idioma de reserva"
label_en = "Fallback language"
help_pt = "Idioma usado quando falta uma tradução."
help_en = "Language used when a translation is missing."
why = "Inglês é o fallback do kernel e evita rótulo vazio."
label_key = "setting-i18n-language-fallback-label"
help_key = "setting-i18n-language-fallback-help"

[[setting]]
key = "i18n.time.format"
module = "i18n"
group = "appearance"
type = "choice"
default = "auto"
options = ["auto", "24h", "12h"]
label_pt = "Formato de hora"
label_en = "Time format"
help_pt = "Relógio de 24 ou 12 horas."
help_en = "24-hour or 12-hour clock."
why = "Auto segue o formato de hora do Windows."
label_key = "setting-i18n-time-format-label"
help_key = "setting-i18n-time-format-help"

[[setting]]
key = "i18n.date.week_start"
module = "i18n"
group = "appearance"
type = "choice"
default = "auto"
options = ["auto", "sunday", "monday"]
label_pt = "Início da semana"
label_en = "Week starts on"
help_pt = "Primeiro dia da semana em calendários."
help_en = "First day of the week in calendars."
why = "Auto respeita a região configurada no Windows."
label_key = "setting-i18n-date-week_start-label"
help_key = "setting-i18n-date-week_start-help"

[[setting]]
key = "notifications.toast.enabled"
module = "notifications"
group = "appearance"
type = "toggle"
default = true
label_pt = "Avisos na tela"
label_en = "On-screen toasts"
help_pt = "Mostra avisos temporários no canto da janela."
help_en = "Shows temporary toasts in the window corner."
why = "Aviso na tela não interrompe o trabalho."
label_key = "setting-notifications-toast-enabled-label"
help_key = "setting-notifications-toast-enabled-help"

[[setting]]
key = "notifications.toast.position"
module = "notifications"
group = "appearance"
type = "choice"
default = "bottom_right"
options = ["bottom_right", "top_right", "bottom_left", "top_left"]
label_pt = "Posição dos avisos"
label_en = "Toast position"
help_pt = "Canto onde os avisos aparecem."
help_en = "Corner where toasts appear."
why = "Perto da barra de status, onde o olho já procura estado."
label_key = "setting-notifications-toast-position-label"
help_key = "setting-notifications-toast-position-help"

[[setting]]
key = "notifications.toast.duration_s"
module = "notifications"
group = "appearance"
type = "number"
default = 5
min = 2
max = 15
label_pt = "Duração do aviso (s)"
label_en = "Toast duration (s)"
help_pt = "Tempo que cada aviso permanece na tela."
help_en = "How long each toast stays on screen."
why = "5 s dá tempo de ler sem cobrir o trabalho."
label_key = "setting-notifications-toast-duration_s-label"
help_key = "setting-notifications-toast-duration_s-help"

[[setting]]
key = "notifications.toast.max"
module = "notifications"
group = "appearance"
type = "number"
default = 3
min = 1
max = 5
label_pt = "Avisos simultâneos"
label_en = "Simultaneous toasts"
help_pt = "Quantidade máxima de avisos empilhados."
help_en = "Maximum number of stacked toasts."
why = "Três avisos evitam uma parede de mensagens."
label_key = "setting-notifications-toast-max-label"
help_key = "setting-notifications-toast-max-help"

[[setting]]
key = "notifications.os.enabled"
module = "notifications"
group = "appearance"
type = "toggle"
default = true
label_pt = "Notificação do Windows"
label_en = "Windows notification"
help_pt = "Envia avisos para a central de notificações do Windows."
help_en = "Sends notifications to the Windows notification center."
why = "A central do Windows alcança você com a Forja minimizada."
label_key = "setting-notifications-os-enabled-label"
help_key = "setting-notifications-os-enabled-help"

[[setting]]
key = "notifications.os.only_unfocused"
module = "notifications"
group = "appearance"
type = "toggle"
default = true
label_pt = "Só quando a Forja não está em foco"
label_en = "Only when Forja is unfocused"
help_pt = "Notifica pelo Windows só quando a Forja não está em foco."
help_en = "Sends Windows notifications only when Forja is not focused."
why = "Com a janela ativa, o aviso na tela já basta."
label_key = "setting-notifications-os-only_unfocused-label"
help_key = "setting-notifications-os-only_unfocused-help"

[[setting]]
key = "notifications.os.sound"
module = "notifications"
group = "appearance"
type = "toggle"
default = false
label_pt = "Som nas notificações"
label_en = "Notification sound"
help_pt = "Toca o som do Windows ao notificar."
help_en = "Plays the Windows sound when notifying."
why = "Som por padrão atrapalha quem ouve música; a voz tem controle próprio."
label_key = "setting-notifications-os-sound-label"
help_key = "setting-notifications-os-sound-help"

[[setting]]
key = "notifications.quiet.enabled"
module = "notifications"
group = "appearance"
type = "toggle"
default = false
label_pt = "Horário de silêncio"
label_en = "Quiet hours"
help_pt = "Silencia avisos dentro de um intervalo de horas."
help_en = "Mutes notifications during a time range."
why = "Silêncio inesperado faz perder pedido; é opt-in."
label_key = "setting-notifications-quiet-enabled-label"
help_key = "setting-notifications-quiet-enabled-help"

[[setting]]
key = "notifications.quiet.start"
module = "notifications"
group = "appearance"
type = "text"
default = "22:00"
hint = "HH:MM"
label_pt = "Início do silêncio"
label_en = "Quiet start"
help_pt = "Hora em que o horário de silêncio começa."
help_en = "Time when quiet hours start."
why = "22:00 cobre a noite típica de quem trabalha tarde."
label_key = "setting-notifications-quiet-start-label"
help_key = "setting-notifications-quiet-start-help"

[[setting]]
key = "notifications.quiet.end"
module = "notifications"
group = "appearance"
type = "text"
default = "07:00"
hint = "HH:MM"
label_pt = "Fim do silêncio"
label_en = "Quiet end"
help_pt = "Hora em que o horário de silêncio termina."
help_en = "Time when quiet hours end."
why = "07:00 devolve os avisos junto com o começo do dia."
label_key = "setting-notifications-quiet-end-label"
help_key = "setting-notifications-quiet-end-help"

[[setting]]
key = "bench.worktree.location"
module = "bench"
group = "benches"
type = "choice"
default = "data_dir"
options = ["data_dir", "beside_project", "custom"]
label_pt = "Onde ficam as bancadas"
label_en = "Where benches live"
help_pt = "Escolhe se as bancadas ficam na pasta de dados, ao lado do projeto ou num caminho próprio."
help_en = "Chooses whether benches live in the data folder, beside the project or in a custom path."
why = "Fora do repositório evita que busca e git vejam worktrees alheias."
label_key = "setting-bench-worktree-location-label"
help_key = "setting-bench-worktree-location-help"

[[setting]]
key = "bench.worktree.path"
module = "bench"
group = "benches"
type = "path"
default = "%LOCALAPPDATA%\\Forja\\bancadas"
hint = "caminho absoluto"
label_pt = "Pasta das bancadas"
