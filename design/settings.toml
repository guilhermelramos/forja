[[setting]]
key = "appearance.theme.mode"
module = "appearance"
group = "appearance"
type = "choice"
default = "system"
options = ["system", "dark", "light"]
label_pt = "Tema"
label_en = "Theme"
help_pt = "Segue o Windows ou fixa a interface em escuro ou claro."
help_en = "Follows Windows or locks the interface to dark or light."
why = "Seguir o Windows evita contraste inesperado ao alternar dia e noite."
label_key = "setting-appearance-theme-mode-label"
help_key = "setting-appearance-theme-mode-help"

[[setting]]
key = "appearance.theme.dark_name"
module = "appearance"
group = "appearance"
type = "choice"
default = "brasa_escuro"
options = ["brasa_escuro", "carvao", "cinza_quente", "aco"]
options_from = "themes_dark"
label_pt = "Tema escuro"
label_en = "Dark theme"
help_pt = "Tema aplicado quando a interface está no modo escuro."
help_en = "Theme applied when the interface is in dark mode."
why = "Brasa Escuro é a identidade padrão e o contraste de referência."
label_key = "setting-appearance-theme-dark_name-label"
help_key = "setting-appearance-theme-dark_name-help"

[[setting]]
key = "appearance.theme.light_name"
module = "appearance"
group = "appearance"
type = "choice"
default = "brasa_claro"
options = ["brasa_claro"]
options_from = "themes_light"
label_pt = "Tema claro"
label_en = "Light theme"
help_pt = "Tema aplicado quando a interface está no modo claro."
help_en = "Theme applied when the interface is in light mode."
why = "Brasa Claro preserva a mesma hierarquia no modo claro."
label_key = "setting-appearance-theme-light_name-label"
help_key = "setting-appearance-theme-light_name-help"

[[setting]]
key = "appearance.ui.density"
module = "appearance"
group = "appearance"
type = "choice"
default = "comfortable"
options = ["comfortable", "compact"]
label_pt = "Densidade"
label_en = "Density"
help_pt = "Escolhe o espaçamento entre confortável e compacto."
help_en = "Chooses comfortable or compact spacing."
why = "Confortável é o padrão do design system; compacto é opção para telas pequenas."
label_key = "setting-appearance-ui-density-label"
help_key = "setting-appearance-ui-density-help"

[[setting]]
key = "appearance.ui.scale"
module = "appearance"
group = "appearance"
type = "number"
default = 1.0
min = 0.8
max = 1.5
step = 0.05
label_pt = "Escala da interface"
label_en = "UI scale"
help_pt = "Aumenta ou reduz toda a interface."
help_en = "Scales the whole interface up or down."
why = "100% mantém as medidas dos tokens Brasa sem arredondamentos."
label_key = "setting-appearance-ui-scale-label"
help_key = "setting-appearance-ui-scale-help"

[[setting]]
key = "appearance.ui.font_family"
deferred = "Aguardando API de seleção de fontes no ui-kit."
module = "appearance"
group = "appearance"
type = "choice"
default = "auto"
options = ["auto", "segoe_ui_variable", "segoe_ui", "system"]
label_pt = "Fonte da interface"
label_en = "UI font"
help_pt = "Fonte dos menus, rótulos e textos da interface."
help_en = "Font used in menus, labels and interface text."
why = "Auto usa Segoe UI Variable quando o Windows oferece e cai para Segoe UI."
label_key = "setting-appearance-ui-font_family-label"
help_key = "setting-appearance-ui-font_family-help"

[[setting]]
key = "appearance.ui.font_size"
deferred = "Aguardando métricas tipográficas configuráveis no ui-kit."
module = "appearance"
group = "appearance"
type = "number"
default = 14
min = 12
max = 18
label_pt = "Tamanho do texto"
label_en = "Text size"
help_pt = "Tamanho base do texto da interface."
help_en = "Base size of interface text."
why = "14 px é o menor tamanho que mantém a grade de 4 px confortável."
label_key = "setting-appearance-ui-font_size-label"
help_key = "setting-appearance-ui-font_size-help"

[[setting]]
key = "appearance.ui.code_font"
deferred = "Aguardando API de seleção de fontes de código no ui-kit."
module = "appearance"
group = "appearance"
type = "choice"
default = "cascadia_code"
options = ["cascadia_code", "cascadia_mono", "consolas", "jetbrains_mono"]
label_pt = "Fonte de código"
label_en = "Code font"
help_pt = "Fonte padrão para editor e terminal."
help_en = "Default font for editor and terminal."
why = "Cascadia Code é a fonte da identidade e acompanha o Windows 11; sem ela, a Forja usa Consolas."
label_key = "setting-appearance-ui-code_font-label"
help_key = "setting-appearance-ui-code_font-help"

[[setting]]
key = "appearance.ui.code_size"
deferred = "Aguardando métricas tipográficas configuráveis no ui-kit."
module = "appearance"
group = "appearance"
type = "number"
default = 13
min = 10
max = 24
label_pt = "Tamanho do código"
label_en = "Code size"
help_pt = "Tamanho base do código no editor e no terminal."
help_en = "Base code size in editor and terminal."
why = "13 px mantém cerca de 100 colunas visíveis em telas comuns."
label_key = "setting-appearance-ui-code_size-label"
help_key = "setting-appearance-ui-code_size-help"

[[setting]]
key = "appearance.ui.ligatures"
deferred = "Aguardando suporte de composição tipográfica a ligaduras no renderizador."
module = "appearance"
group = "appearance"
type = "toggle"
default = true
label_pt = "Ligaduras"
label_en = "Ligatures"
help_pt = "Desenha sequências como -> e => como um único glifo."
help_en = "Draws sequences such as -> and => as a single glyph."
why = "Ligaduras são legíveis e não alteram o texto do arquivo."
label_key = "setting-appearance-ui-ligatures-label"
help_key = "setting-appearance-ui-ligatures-help"

[[setting]]
key = "appearance.motion.reduce"
module = "appearance"
group = "appearance"
type = "choice"
default = "auto"
options = ["auto", "always", "never"]
label_pt = "Reduzir movimento"
label_en = "Reduce motion"
help_pt = "Segue a preferência de acessibilidade do sistema ou força a redução."
help_en = "Follows the system accessibility preference or forces reduction."
why = "Auto respeita quem já pediu menos animação no Windows."
label_key = "setting-appearance-motion-reduce-label"
help_key = "setting-appearance-motion-reduce-help"

[[setting]]
key = "appearance.motion.duration_ms"
deferred = "Aguardando duração de animação configurável nos tokens do ui-kit."
module = "appearance"
group = "appearance"
type = "number"
default = 120
min = 0
max = 400
label_pt = "Duração da animação (ms)"
label_en = "Animation duration (ms)"
help_pt = "Duração das transições curtas."
help_en = "Duration of short transitions."
why = "120 ms é perceptível sem atrasar a resposta da interface."
label_key = "setting-appearance-motion-duration_ms-label"
help_key = "setting-appearance-motion-duration_ms-help"

[[setting]]
key = "appearance.colors.accent"
module = "appearance"
group = "appearance"
type = "color"
default = "#F2762E"
hint = "#RRGGBB"
label_pt = "Cor de destaque"
label_en = "Accent color"
help_pt = "Cor de ação principal e de foco."
help_en = "Primary action and focus color."
why = "O padrão é o token accent da Brasa; a troca não muda o contraste do texto."
label_key = "setting-appearance-colors-accent-label"
help_key = "setting-appearance-colors-accent-help"

[[setting]]
key = "appearance.sidebar.visible"
module = "appearance"
group = "appearance"
type = "toggle"
default = true
label_pt = "Mostrar lateral"
label_en = "Show sidebar"
help_pt = "Mostra a lista de projetos e bancadas."
help_en = "Shows the project and bench list."
why = "A lateral é o mapa de projetos e bancadas e começa à vista."
label_key = "setting-appearance-sidebar-visible-label"
help_key = "setting-appearance-sidebar-visible-help"

[[setting]]
key = "appearance.sidebar.width"
module = "appearance"
group = "appearance"
type = "number"
default = 260
min = 180
max = 480
label_pt = "Largura da lateral"
label_en = "Sidebar width"
help_pt = "Largura da lateral em pixels."
help_en = "Sidebar width in pixels."
why = "260 px cabe nome de projeto e branch sem truncar."
label_key = "setting-appearance-sidebar-width-label"
help_key = "setting-appearance-sidebar-width-help"

[[setting]]
key = "appearance.rail.visible"
module = "appearance"
group = "appearance"
type = "toggle"
default = true
label_pt = "Mostrar trilho"
label_en = "Show rail"
help_pt = "Mostra o trilho de navegação à esquerda."
help_en = "Shows the left navigation rail."
why = "O trilho é a navegação primária e não deve sumir por acidente."
label_key = "setting-appearance-rail-visible-label"
help_key = "setting-appearance-rail-visible-help"

[[setting]]
key = "appearance.status_bar.visible"
module = "appearance"
group = "appearance"
type = "toggle"
default = true
label_pt = "Mostrar barra de status"
label_en = "Show status bar"
help_pt = "Mostra branch, ajudantes ativos, uso e recursos na base."
help_en = "Shows branch, active helpers, usage and resources at the bottom."
why = "A barra é o painel de saúde do trabalho em andamento."
label_key = "setting-appearance-status_bar-visible-label"
help_key = "setting-appearance-status_bar-visible-help"

[[setting]]
key = "appearance.window.remember_geometry"
module = "appearance"
group = "appearance"
type = "toggle"
default = true
label_pt = "Lembrar tamanho e posição"
label_en = "Remember size and position"
help_pt = "Reabre a janela no tamanho e na posição anteriores."
help_en = "Reopens the window at its previous size and position."
why = "Retomar o layout é mais útil que centralizar a janela a cada abertura."
label_key = "setting-appearance-window-remember_geometry-label"
help_key = "setting-appearance-window-remember_geometry-help"

[[setting]]
key = "appearance.window.start_maximized"
module = "appearance"
group = "appearance"
type = "toggle"
default = false
label_pt = "Abrir maximizada"
label_en = "Start maximized"
help_pt = "Inicia a janela ocupando a tela inteira."
help_en = "Starts the window filling the entire screen."
why = "Abrir no tamanho anterior evita surpresa em monitores múltiplos."
label_key = "setting-appearance-window-start_maximized-label"
help_key = "setting-appearance-window-start_maximized-help"

[[setting]]
key = "appearance.tabs.middle_click"
deferred = "Aguardando contrato de fechamento das abas do shell."
module = "appearance"
group = "appearance"
type = "toggle"
default = true
label_pt = "Fechar aba com botão do meio"
label_en = "Middle-click closes tab"
help_pt = "Fecha a aba ao clicar com o botão do meio."
help_en = "Closes a tab when middle-clicked."
why = "O gesto é o esperado em abas e navegadores."
label_key = "setting-appearance-tabs-middle_click-label"
help_key = "setting-appearance-tabs-middle_click-help"

[[setting]]
key = "appearance.tooltips.enabled"
deferred = "Aguardando controle compartilhado de dicas nos componentes da interface."
module = "appearance"
group = "appearance"
type = "toggle"
default = true
label_pt = "Dicas"
label_en = "Tooltips"
help_pt = "Mostra uma dica ao passar o mouse sobre controles."
help_en = "Shows a hint when hovering controls."
why = "Dicas curtas ensinam atalhos sem abrir a ajuda."
label_key = "setting-appearance-tooltips-enabled-label"
help_key = "setting-appearance-tooltips-enabled-help"

[[setting]]
key = "i18n.language.mode"
module = "i18n"
group = "appearance"
