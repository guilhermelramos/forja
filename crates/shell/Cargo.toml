[package]
name = "forja-app"
description = "Forja desktop shell: borderless window, slots, Anvil and generated settings."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "forja-app"
path = "src/main.rs"

[dependencies]
forja-kernel = { path = "../kernel", features = ["egui"] }
forja-protocol = { path = "../protocol" }
forja-ui-kit = { path = "../ui-kit" }
eframe.workspace = true
serde_json.workspace = true
toml.workspace = true
image.workspace = true
base64.workspace = true
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Globalization",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_LibraryLoader",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

# Modules are linked here. `cargo xtask new-module <name>` edits only this block;
# never edit another file to add a module.
# forja:modules:start
forja-module-projects = { path = "../modules/projects" }
forja-module-benches = { path = "../modules/benches" }
