[package]
name = "forja-module-browser"
description = "Forja module browser: embedded WebView2 tabs, history and Mermaid."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
forja-kernel = { path = "../../kernel", features = ["egui"] }
forja-contracts = { path = "../../contracts" }
forja-ui-kit = { path = "../../ui-kit" }
linkme.workspace = true
serde.workspace = true
serde_json.workspace = true
wry.workspace = true
rfd.workspace = true
raw-window-handle.workspace = true
webview2-com.workspace = true
windows-core.workspace = true
windows-sys = { workspace = true, features = ["Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi", "Win32_System_LibraryLoader"] }
